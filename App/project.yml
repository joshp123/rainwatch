# Xcode project spec. Generate Rain.xcodeproj with: nix run nixpkgs#xcodegen -- generate
name: Rain
options:
  bundleIdPrefix: nl.jjp
  deploymentTarget:
    watchOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  RainGraph:
    path: ..
settings:
  base:
    DEVELOPMENT_TEAM: 7M8BR7R488
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # The App Store takes a watch-only app only inside an iPhone app that never runs: an archive of
  # the watch app alone can't be sent to App Store Connect. Archive this target's scheme for iOS.
  RainContainer:
    type: application.watchapp2-container
    platform: iOS
    dependencies:
      - target: Rain
    info:
      path: RainContainer/Info.plist
      properties:
        CFBundleDisplayName: BuienWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSWatchOnlyContainer: true
        LSApplicationLaunchProhibited: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jjp.rain
    scheme: {}
  Rain:
    type: application
    platform: watchOS
    sources:
      - path: Rain
        excludes: [AppIcon.icon]
      - path: Rain/AppIcon.icon
        buildPhase: resources
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RainGraph
      - target: RainWidget
    info:
      path: Rain/Info.plist
      properties:
        CFBundleDisplayName: BuienWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "To show the rain where you are. It is sent rounded to about 1 km."
    entitlements:
      path: Rain/Rain.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.jjp.rain]
    settings:
      base:
        # Apple requires the container's bundle ID as the prefix of the watch app's.
        PRODUCT_BUNDLE_IDENTIFIER: nl.jjp.rain.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [RainUITests]
  RainUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [RainUITests]
    dependencies:
      - target: Rain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jjp.rain.watchkitapp.uitests
        TEST_TARGET_NAME: Rain
        GENERATE_INFOPLIST_FILE: YES
  RainWidget:
    type: app-extension
    platform: watchOS
    sources:
      - RainWidget
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RainGraph
    info:
      path: RainWidget/Info.plist
      properties:
        CFBundleDisplayName: BuienWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSWidgetWantsLocation: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "To show the rain where you are. It is sent rounded to about 1 km."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RainWidget/RainWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.jjp.rain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jjp.rain.watchkitapp.widget
