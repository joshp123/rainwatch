# Xcode project spec. Generate Rain.xcodeproj with: nix run nixpkgs#xcodegen -- generate
name: Rain
options:
  bundleIdPrefix: nl.jjp
  deploymentTarget:
    watchOS: "26.0"
  createIntermediateGroups: true
packages:
  RainGraph:
    path: ..
settings:
  base:
    DEVELOPMENT_TEAM: 7M8BR7R488
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rain:
    type: application
    platform: watchOS
    sources:
      - Rain
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RainGraph
      - target: RainWidget
    info:
      path: Rain/Info.plist
      properties:
        CFBundleDisplayName: Rain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Rain uses your location to show the rain forecast where you are. To fetch it, Rain sends your location rounded to about 1 km. Your last location is kept only on this watch."
    entitlements:
      path: Rain/Rain.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.jjp.rain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jjp.rain
    scheme:
      testTargets: [RainUITests]
  RainUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [RainUITests]
    dependencies:
      - target: Rain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jjp.rain.uitests
        TEST_TARGET_NAME: Rain
        GENERATE_INFOPLIST_FILE: YES
  RainWidget:
    type: app-extension
    platform: watchOS
    sources:
      - RainWidget
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RainGraph
    info:
      path: RainWidget/Info.plist
      properties:
        CFBundleDisplayName: Rain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSWidgetWantsLocation: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Rain uses your location to show the rain forecast where you are. To fetch it, Rain sends your location rounded to about 1 km. Your last location is kept only on this watch."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RainWidget/RainWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.jjp.rain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jjp.rain.widget
