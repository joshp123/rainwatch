# Xcode project spec. Generate Rain.xcodeproj with: nix run nixpkgs#xcodegen -- generate
name: Rain
options:
  bundleIdPrefix: nl.jjp
  deploymentTarget:
    watchOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  RainGraph:
    path: ..
settings:
  base:
    DEVELOPMENT_TEAM: 7M8BR7R488
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "9"
targets:
  # The iPhone app: the same forecast, its own Lock Screen widgets, and the watch app inside it.
  # The watch app still runs without it (WKRunsIndependentlyOfCompanionApp). Archive this scheme for iOS.
  RainPhone:
    type: application
    platform: iOS
    sources:
      - RainPhone
      - path: Rain/RainApp.swift
      - path: Rain/AboutPage.swift
      - path: Rain/PlacePicker.swift
      - path: Rain/RadarPage.swift
      - path: Rain/AppIcon.icon
        buildPhase: resources
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/InfoPlist.xcstrings
        buildPhase: resources
    dependencies:
      - package: RainGraph
      - target: RainPhoneWidget
      - target: Rain
    info:
      path: RainPhone/Info.plist
      properties:
        CFBundleDisplayName: RainWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "RainWatch rounds your location to about 1 km to get the rain forecast."
    entitlements:
      path: RainPhone/RainPhone.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.jjp.rain]
        com.apple.developer.weatherkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jjp.rain
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [RainPhoneUITests]
  RainPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RainPhoneUITests]
    dependencies:
      - target: RainPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jjp.rain.uitests
        TEST_TARGET_NAME: RainPhone
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  RainPhoneWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RainWidget/RainWidget.swift
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/InfoPlist.xcstrings
        buildPhase: resources
    dependencies:
      - package: RainGraph
    info:
      path: RainPhoneWidget/Info.plist
      properties:
        CFBundleDisplayName: RainWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSWidgetWantsLocation: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "RainWatch rounds your location to about 1 km to get the rain forecast."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RainPhoneWidget/RainPhoneWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.jjp.rain]
        com.apple.developer.weatherkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jjp.rain.widget
        TARGETED_DEVICE_FAMILY: "1"
  Rain:
    type: application
    platform: watchOS
    sources:
      - path: Rain
        excludes: [AppIcon.icon]
      - path: Rain/AppIcon.icon
        buildPhase: resources
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/InfoPlist.xcstrings
        buildPhase: resources
    dependencies:
      - package: RainGraph
      - target: RainWidget
    info:
      path: Rain/Info.plist
      properties:
        CFBundleDisplayName: RainWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: nl.jjp.rain
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "RainWatch rounds your location to about 1 km to get the rain forecast."
    entitlements:
      path: Rain/Rain.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.jjp.rain]
        com.apple.developer.weatherkit: true
    settings:
      base:
        # Apple requires the container's bundle ID as the prefix of the watch app's.
        PRODUCT_BUNDLE_IDENTIFIER: nl.jjp.rain.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [RainUITests]
  RainUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: RainUITests
        excludes: [Server]
    dependencies:
      - target: Rain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jjp.rain.watchkitapp.uitests
        TEST_TARGET_NAME: Rain
        GENERATE_INFOPLIST_FILE: YES
  RainWidget:
    type: app-extension
    platform: watchOS
    sources:
      - RainWidget
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/InfoPlist.xcstrings
        buildPhase: resources
    dependencies:
      - package: RainGraph
    info:
      path: RainWidget/Info.plist
      properties:
        CFBundleDisplayName: RainWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSWidgetWantsLocation: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "RainWatch rounds your location to about 1 km to get the rain forecast."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RainWidget/RainWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.jjp.rain]
        com.apple.developer.weatherkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jjp.rain.watchkitapp.widget
