<!doctype html>
<!-- Written by AI on 2026.11.18 by model claude fable 5.2. The design bench for RainWatch's iPhone widgets:
     every slot in the states that matter, drawn from a real KNMI run. ?lang=nl for Dutch. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RainWatch widgets</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #16161a; color: #fff; font: 13px/18px -apple-system, system-ui; padding: 24px; -webkit-font-smoothing: antialiased; }
  h2 { font: 600 15px/20px -apple-system, system-ui; margin: 28px 0 12px; color: rgba(235,235,245,.7); }
  .row { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
  .cell { display: flex; flex-direction: column; gap: 8px; }
  .cell > span { color: rgba(235,235,245,.5); font-size: 12px; }
  .lock { width: 393px; height: 320px; border-radius: 36px 36px 0 0; padding-top: 58px; display: flex; flex-direction: column; align-items: center;
          background: linear-gradient(160deg, #2b3a55, #4a3b5e 55%, #1d2233); position: relative; overflow: hidden; }
  .lock.photo { background: linear-gradient(170deg, #8fa9c4, #c7b7a3 60%, #6d7f8f); }
  .inline { font: 600 17px/22px -apple-system, 'SF Pro Text', system-ui; color: rgba(255,255,255,.92); height: 22px; }
  .time { font: 700 96px/100px 'SF Pro Rounded', -apple-system, system-ui; letter-spacing: -2px; color: rgba(255,255,255,.92); margin-top: -2px; }
  .slots { display: flex; gap: 12px; margin-top: 6px; width: 349px; }
  .rect { width: 160px; height: 72px; padding: 5px 4px 0; }
  .rect .h { font: 600 15px/19px -apple-system, 'SF Pro Text', system-ui; white-space: nowrap; }
  .rect .s { font: 400 12px/15px -apple-system, 'SF Pro Text', system-ui; color: #B0B0B0; white-space: nowrap; }
  .circle { width: 72px; height: 72px; }
  .small, .medium { border-radius: 24px; padding: 16px; display: flex; flex-direction: column; color: #fff; }
  .small { width: 158px; height: 158px; }
  .medium { width: 338px; height: 158px; }
  .wet { background: linear-gradient(#152a45, #0c1726); }
  .dryb { background: #1c1c1e; }
  .where { font: 600 12px/16px -apple-system, system-ui; color: rgba(235,235,245,.62); display: flex; align-items: center; gap: 4px; }
  .small .h { font: 700 20px/24px -apple-system, 'SF Pro Display', system-ui; letter-spacing: .3px; margin-top: 4px; }
  .medium .h { font: 700 22px/27px -apple-system, 'SF Pro Display', system-ui; letter-spacing: .3px; margin-top: 3px; }
  .medium .s { font: 400 15px/20px -apple-system, system-ui; color: rgba(235,235,245,.62); }
  .medium .s.rain, .small .s.rain { color: #6CAAE0; }
  .small .s { font: 400 12px/16px -apple-system, system-ui; color: rgba(235,235,245,.62); white-space: nowrap; }
  .grow { flex: 1; }
  .standby { background: #000; padding: 20px; border-radius: 20px; display: flex; gap: 24px; }
  .standby .small { transform: scale(1); background: none; padding: 8px; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module" src="widgets.js"></script>
</body>
</html>
